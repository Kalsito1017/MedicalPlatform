<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Messages — MediCore Clinical Platform</title>
  <meta name="description" content="Internal staff messages for the MediCore Clinical Platform.">
  <link rel="icon" href="assets/images/favicon.svg">
  <script src="assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- Pre-rendering: module warm-up for the shared graph (no execution, no external
       resources; see DESIGN.md "Pre-rendering and intent prefetch"). -->
  <link rel="modulepreload" href="assets/js/ui.js">
  <link rel="modulepreload" href="assets/js/api.js">
  <link rel="modulepreload" href="assets/js/cache.js">
  <link rel="modulepreload" href="assets/js/auth.js">
  <link rel="modulepreload" href="assets/js/command-menu.js?v=20261109j">
  <script>
    /* Deployment override — see assets/js/config.js. Example:
       window.__APP_CONFIG__ = { API_BASE_URL: "https://<backend-host>/api/v1" }; */
    window.__APP_CONFIG__ = window.__APP_CONFIG__ || {};
  </script>
</head>
<body>


  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__head">
        <a class="brand" href="dashboard.html">
          <span class="brand__mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 32 32" focusable="false"><path d="M16 7v18M7 16h18" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
          </span>
          <span class="brand__text">
            <span class="brand__name">MediCore</span>
            <span class="brand__tag">Clinical Platform</span>
          </span>
        </a>
        <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      </div>
      <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
      <div class="sidebar__foot">
        <div class="help-card">
          <p class="help-card__head">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.9.6c0 1.7-2.5 2-2.5 3.5"/><path d="M12 16.6v.2"/></svg>
            Need help?
          </p>
          <p class="help-card__text">Open the About panel or contact the maintainers about a problem.</p>
          <ul class="help-card__links">
            <li><button type="button" class="link-button" data-open-about>About</button></li>
            <li><a href="mailto:support@example.com?subject=Clinical%20AI%20Platform%20issue">Report an issue</a></li>
          </ul>
        </div>
      </div>
    </aside>

    <div class="app-column">
      <header class="topbar">
        <button class="btn btn-secondary btn-sm command-trigger" type="button" id="command-menu-button">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>
          Search &amp; commands
          <kbd class="kbd" data-command-shortcut>Ctrl/&#8984; K</kbd>
        </button>
        <div class="user-area" id="user-area"></div>
      </header>

      <div id="global-status" class="global-status" role="status" aria-live="polite"></div>

      <main id="main" class="container main messages-page">
        <div class="page-header messages-page-header">
          <div>
            <div class="messages-title">
              <span class="messages-title__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>
              </span>
              <div>
                <h1>Messages</h1>
                <p class="lede">Internal staff communication. Only your own inbox and sent messages are visible.</p>
              </div>
            </div>
            <p class="messages-page-counts" aria-live="polite">
              <span id="messages-count">Loading messages…</span>
              <span id="messages-unread" class="messages-page-counts__unread"></span>
            </p>
          </div>
          <button class="btn btn-primary messages-new" type="button" id="messages-new" hidden>
            <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            New message
          </button>
        </div>

        <div id="page-body">
          <div class="loading-block" id="messages-loading">
            <div class="heart-loader heart-loader--md">
              <img class="heart-loader__img" src="assets/images/heart-loader.png" alt="" aria-hidden="true">
              <p class="heart-loader__label">Loading your messages&hellip;</p>
            </div>
          </div>
          <div id="messages-status" class="status-region" role="status" aria-live="polite"></div>

          <div class="messages-workspace" id="messages-workspace">
            <section class="messages-panel" id="messages-list-panel" aria-label="Message folders">
              <div class="message-tabs" role="tablist" aria-label="Message folders">
                <button class="tab is-active" type="button" role="tab" id="messages-inbox-tab"
                        aria-selected="true" aria-controls="messages-region">
                  Inbox <span class="message-tab__count" id="messages-inbox-count"></span>
                </button>
                <button class="tab" type="button" role="tab" id="messages-sent-tab"
                        aria-selected="false" aria-controls="messages-region">
                  Sent <span class="message-tab__count" id="messages-sent-count"></span>
                </button>
              </div>
              <form class="message-search" id="messages-search-form" role="search">
                <label class="visually-hidden" for="messages-search">Search messages</label>
                <span class="message-search__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>
                </span>
                <input id="messages-search" type="search" autocomplete="off" maxlength="100" placeholder="Search messages…">
              </form>
              <div id="messages-region" class="messages-list" aria-label="Message list"></div>
            </section>
            <section id="messages-detail" class="messages-detail" aria-label="Message detail" aria-live="polite"></section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="assets/js/messages.js?v=20261111a"></script>
</body>
</html>
