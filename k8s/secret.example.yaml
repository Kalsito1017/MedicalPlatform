# TEMPLATE ONLY — copy to k8s/secret.yaml (gitignored) and replace every
# REPLACE_ME value. NEVER commit k8s/secret.yaml and NEVER put real values in
# this file.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml      # then edit by hand, or
#   scripts/k8s/gen-secret.sh                       # generates real random values
#
# All values below are clearly-fake placeholders. `stringData` is used so the
# values are plain text in the file (Kubernetes base64-encodes them on write);
# that also avoids committing anything that even looks like a real credential.
#
# The app Deployment and the seed Job load this with envFrom, so every key
# becomes an environment variable of the same name (see backend/app/config.py
# and .env.example for the canonical variable list).
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: clinical
  labels:
    app.kubernetes.io/part-of: clinical-ai-platform
type: Opaque
stringData:
  # --- Required by the application ---
  # 32+ random bytes, e.g. `openssl rand -base64 48`.
  APP_SECRET_KEY: "REPLACE_ME_fake_app_secret_key_not_a_real_value"

  # Database URLs point at the in-cluster Postgres Service
  # (db.clinical.svc = Service `db` in namespace `clinical`). Keep the
  # username/password here in step with POSTGRES_* below.
  DATABASE_URL: "postgresql+asyncpg://app:REPLACE_ME_fake_db_password@db.clinical.svc:5432/clinical_demo" # security-check-allow: placeholder-only template, no real credential
  MIGRATION_DATABASE_URL: "postgresql+asyncpg://app:REPLACE_ME_fake_db_password@db.clinical.svc:5432/clinical_demo" # security-check-allow: placeholder-only template, no real credential

  # --- Postgres StatefulSet bootstrap (postgres:16-alpine init) ---
  # These create the database role/schema on FIRST start of the db pod.
  # Changing them later has no effect on an existing data volume.
  POSTGRES_USER: "app"
  POSTGRES_PASSWORD: "REPLACE_ME_fake_db_password" # security-check-allow: placeholder-only template, no real credential
  POSTGRES_DB: "clinical_demo"

  # --- Demo seed accounts (read by scripts/seed_demo_data.py at seed time) ---
  # Clearly-fake demo credentials for the synthetic demo logins. Never real.
  DEMO_ADMIN_EMAIL: "admin@example.com"
  DEMO_ADMIN_PASSWORD: "REPLACE_ME_fake_demo_password_admin" # security-check-allow: placeholder-only template, no real credential
  DEMO_DOCTOR_EMAIL: "doctor@example.com"
  DEMO_DOCTOR_PASSWORD: "REPLACE_ME_fake_demo_password_doctor" # security-check-allow: placeholder-only template, no real credential
  DEMO_NURSE_EMAIL: "nurse@example.com"
  DEMO_NURSE_PASSWORD: "REPLACE_ME_fake_demo_password_nurse" # security-check-allow: placeholder-only template, no real credential

  # --- LLM (optional) ---
  # Only needed when enabling AI features: set LLM_ENABLED=true in
  # k8s/configmap.yaml and add the key here. Omitting it is fine — the app
  # runs fully without it (LLM_* features degrade gracefully).
  # LLM_API_KEY: "REPLACE_ME_fake_llm_api_key"
