[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "clinical-ai-platform-backend"
version = "0.1.0"
description = "Backend for the Clinical AI Platform synthetic-data demo (not for clinical use)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic>=2.11.0",
    "pydantic-settings==2.7.0",
    "argon2-cffi==23.1.0",
    "httpx==0.28.1",
    "mcp>=1.30.0,<2.0.0",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: requires a reachable PostgreSQL database (see TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
